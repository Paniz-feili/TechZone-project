<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت حساب کاربری | تک زون</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">

</head>

<body>

    <header>
        <h1>تک زون</h1>

        <nav class="menu">
            <a href="index.html">خانه</a>
            <a href="index.html">فروشگاه</a>
            <a href="index.html#categories">دسته بندی ها</a>
            <a href="index.html#about">درباره ما</a>
        </nav>

        <div class="sign-in">
            <button type="button">سبد خرید</button>
            <a href="register.html">ورود</a>
        </div>
    </header>

    <form action="/register" method="get">

        <h2>ساخت حساب کاربری</h2>
        <p>برای خرید سریع‌تر، حساب تک زون را بسازید.</p>

        <div class="controller">
            <label for="email">ایمیل</label>
            <input type="email" id="email" name="userEmail" required class="controller_input"
                placeholder="name@example.com">
        </div>

        <div class="controller">
            <label for="phoneNumber">شماره موبایل</label>
            <input type="tel" id="phoneNumber" name="PhoneNumber" required pattern="09[0-9]{9}" maxlength="11"
                title="شماره موبایل باید با 09 شروع شود و 11 رقم باشد." class="controller_input"
                placeholder="09*********">
        </div>

        <div class="controller">
            <label for="password">رمز عبور</label>
            <input type="password" id="password" name="Password" required minlength="8" maxlength="64"
                class="controller_input">
        </div>

        <div class="controller">
            <label for="repeatPassword">تکرار رمز عبور</label>
            <input type="password" id="repeatPassword" name="RepeatPassword" required minlength="8" maxlength="64"
                class="controller_input" placeholder="لطفا رمز عبور خود را تکرار کنید.">
        </div>

        <div class="buttons">
            <button type="reset">پاک کردن</button>
            <button type="submit">ثبت نام</button>
        </div>

    </form>

    <footer class="site-footer">
        <p>تک زون؛ انتخابی ساده برای لوازم جانبی رایانه.</p>

        <div>
            <a href="index.html">خانه</a>
            <a href="index.html">فروشگاه</a>
            <a href="register.html">ثبت‌نام</a>
        </div>

        <p>تمام حقوق این سایت محفوظ است.</p>
    </footer>

</body>

</html>
